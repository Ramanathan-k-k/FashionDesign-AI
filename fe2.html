<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Design Chatbot</title>
    <link rel="stylesheet" href="fe2.css">
</head>
<body>
    <div class="banner">
        <div class="container">
            <h1>Fashion Design Chatbot</h1>
            <form id="fashionForm">
                <div class="form-group">
                    <label for="skinTone">Upload Skin Tone Image:</label>
                    <input type="file" id="skinTone" name="skinTone" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label for="bodyType">Select Body Type:</label>
                    <select id="bodyType" name="bodyType" required>
                        <option value="pear">Pear</option>
                        <option value="apple">Apple</option>
                        <option value="hourglass">Hourglass</option>
                        <option value="rectangle">Rectangle</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="occasion">Select Occasion:</label>
                    <select id="occasion" name="occasion" required>
                        <option value="casual">Casual</option>
                        <option value="formal">Formal</option>
                        <option value="party">Party</option>
                        <option value="wedding">Wedding</option>
                    </select>
                </div>
                <button type="submit">Get Recommendations</button>
            </form>
            <div id="recommendations" class="recommendations">
                <!-- Recommendations will be displayed here -->
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
